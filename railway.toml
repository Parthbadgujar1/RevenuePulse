# Railway Deployment Configuration for RevenuePulse

# Services configuration
# Each service runs in its own container on Railway

# 1. PostgreSQL Database
# - Railway provides managed PostgreSQL
# - Connection string available at: ${DATABASE_URL}
# - Automatic backups and scaling

# 2. Redis (for caching and queue)
# - Managed Redis on Railway
# - Connection string: ${REDIS_URL}

# 3. ML Service (Python FastAPI)
# - Entry point: uvicorn src.main:app
# - Port: $PORT (Railway assigned)
# - Environment variables:
#   - DATABASE_URL from Railway PostgreSQL
#   - REDIS_URL from Railway Redis
#   - GEMINI_API_KEY or GROQ_API_KEY for LLM
#   - ENVIRONMENT=production

# 4. Worker Service (Node.js background jobs)
# - Entry point: npm run worker:start
# - Uses pg-boss for job queue with PostgreSQL backend
# - Port: $PORT (Railway assigned)
# - Environment variables:
#   - DATABASE_URL from Railway PostgreSQL
#   - REDIS_URL from Railway Redis (optional, can use pg-boss alone)
#   - RAZORPAY_API_KEY and RAZORPAY_API_SECRET for production
#   - Simulation mode defaults

# 5. Web Application (Next.js)
# - Entry point: npm run start
# - Port: $PORT (Railway assigned)
# - Environment variables:
#   - DATABASE_URL from Railway PostgreSQL
#   - NEXTAUTH_URL: https://your-app.railway.app
#   - NEXTAUTH_SECRET: random secret for JWT signing
#   - RAZORPAY_API_KEY and RAZORPAY_API_SECRET (optional, for production)
#   - GEMINI_API_KEY or GROQ_API_KEY for LLM features
#   - RAILWAY_ENVIRONMENT=production

# Railway TOML config (optional, for Railway CLI)
# railway.toml:
# services:
#   - name: web
#     buildCommand: npm run build
#     startCommand: npm run start
#   - name: worker
#     buildCommand: npm run build
#     startCommand: npm run worker:start
#   - name: ml
#     buildCommand: pip install -r requirements.txt
#     startCommand: python -m uvicorn src.main:app --host 0.0.0.0 --port $PORT

# Environment Variables (.env.example)
# These should be added to Railway dashboard as secrets:
#
# DATABASE_URL="postgresql://postgres:password@containers-us-west-153.railway.psdb.cloud/revenuepulse"
# REDIS_URL="redis://redis-us1-abc123.upstash.io:6379"
#
# NEXTAUTH_URL="https://your-app.railway.app"
# NEXTAUTH_SECRET="random-super-secret-string"
#
# RAZORPAY_API_KEY="rzp_test_XXX"
# RAZORPAY_API_SECRET="XXX"
#
# GEMINI_API_KEY="your-gemini-key"  # or GROQ_API_KEY="your-groq-key"
#
# RAILWAY_ENVIRONMENT="production"

# Development Commands
# -------------------
# docker-compose up -d       # Start all services locally
# docker-compose down        # Stop all services
# docker-compose exec web npm run dev  # Dev mode for web
# docker-compose exec worker npm run worker:start  # Start worker
# docker-compose exec ml python -m uvicorn src.main:app  # ML service

# Production Deployment
# -------------------
# 1. Push code to git repository
# 2. Connect repository to Railway
# 3. Set environment variables in Railway dashboard
# 4. Railway auto-detects and deploys all services
# 5. Monitor logs and analytics in Railway dashboard

# Database Migration
# ----------------
# Run migrations via Railway:
# railway run prisma migrate deploy
# Or locally:
# npx prisma migrate deploy

# Health Checks
# -----------
# Each service should expose a /api/health endpoint:
# - Web: /api/health
# - ML: /health
# - Worker: /api/health

# Scaling Notes
# ------------
# - PostgreSQL: Railway scales vertically automatically
# - Redis: Consider Upstash or Redis Labs for higher throughput
# - ML service: Can scale horizontally if needed
# - Worker: pg-boss handles concurrency; monitor job queue length