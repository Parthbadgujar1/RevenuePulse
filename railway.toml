# Railway Deployment Configuration for RevenuePulse — this file configures
# the **web** service (Railway reads railway.toml at the repo root for the
# service whose Root Directory is "/"). The worker and ML service are
# separate Railway services in the same project, built from their own
# Dockerfiles (see the bottom of this file and README.md → Deploy).
#
# Stack: Next.js web + pg-boss worker (Node) + FastAPI ML service on top of
# a single managed PostgreSQL instance. Redis is NOT used — the job queue and
# all persistence live in Postgres (pg-boss).
#
# Minimal deploy: this "web" service alone, with RP_USE_QUEUE unset (runs the
# pipeline inline) — see the two options in the ML_SERVICE_URL note below.
# Full deploy: add the `worker` and `ml` services described below and set
# RP_USE_QUEUE=1 on web + worker.
#
# NOTE: this file's [build]/[deploy] tables reflect the Nixpacks path and are
# kept for reference/portability, but the live web service on Railway is
# currently configured via the dashboard to use the Dockerfile builder
# (apps/web/Dockerfile) instead — Nixpacks is deprecated on Railway and its
# auto-detected start command doesn't work for this monorepo layout. If you
# reconnect this service to GitHub for auto-deploys, check Settings → Build
# on the dashboard matches: Builder = Dockerfile, Dockerfile Path =
# apps/web/Dockerfile, and Settings → Networking target port matches whatever
# $PORT Railway assigns (check the deploy logs after the first build; the
# Dockerfile's own ENV PORT=3000 default is overridden by Railway at runtime).

[build]
  # Build the Next.js web app from the repo root (npm workspaces).
  builder = "nixpacks"
  # output: 'standalone' deliberately excludes .next/static and public/ from
  # the standalone bundle (they're meant to be copied in separately, same as
  # apps/web/Dockerfile does for the Docker path) — server.js looks for them
  # as siblings of itself, so without this copy every /_next/static/* asset
  # 404s and the deployed app renders unstyled.
  buildCommand = "npm install && cd packages/database && npx prisma generate && cd ../../apps/web && npm run build && cp -r .next/static .next/standalone/apps/web/.next/static && cp -r public .next/standalone/apps/web/public"

[deploy]
  startCommand = "npx prisma db push && node apps/web/.next/standalone/apps/web/server.js"
  healthcheckPath = "/api/health"
  healthcheckTimeout = 120
  restartPolicyType = "ON_FAILURE"
  restartPolicyMaxRetries = 3

# Schema migrations: with the Dockerfile builder, the production image does
# NOT include the `prisma` CLI (it's a devDependency, and the runner stage
# only ships the standalone server + generated client) — do NOT add
# `npx prisma db push` as a pre-deploy command, it will try to download a
# fresh prisma version at deploy time and fail/time out. Instead, run it
# manually when the schema changes:
#   railway run npx prisma db push --schema packages/database/prisma/schema.prisma

# ── Environment variables for the "web" service ─────────────────────────────
# Set these in the Railway dashboard → web service → Variables.
#   DATABASE_URL          — Railway auto-injects this if you add a Postgres
#                           plugin to the project and reference it as
#                           ${{Postgres.DATABASE_URL}}
#   NEXTAUTH_URL           — https://<your-app>.up.railway.app (or custom domain)
#   NEXTAUTH_SECRET        — openssl rand -base64 32
#   ML_SERVICE_URL         — http://ml.railway.internal:8000 if you deploy the
#                            `ml` service below (private network — no public
#                            hostname or TLS needed between Railway services
#                            in the same project); otherwise omit and set
#                            RP_ML_FALLBACK=heuristic for a quick demo deploy
#                            with no Python service (dev-grade, not for real use)
#   ML_INTERNAL_TOKEN      — shared secret; must match the `ml` service exactly
#   RP_USE_QUEUE           — 1 to route pipeline jobs to the `worker` service
#                            (leave unset to run the pipeline inline on web)
#   GEMINI_API_KEY[_2|_3]  — Gemini keys (multi-key failover, optional)
#   GROQ_API_KEY[_2]       — Groq keys (multi-key failover, optional)
#   RAZORPAY_MODE          — demo (default) | live
#   RAZORPAY_WEBHOOK_SECRET — required only when RAZORPAY_MODE=live

# ── Deploy the ML service as a second Railway service (same repo) ──────────
# New service → same GitHub repo → Settings:
#   Builder:         Dockerfile
#   Dockerfile Path: services/ml/Dockerfile
#   Root Directory:  / (repo root — the Dockerfile COPYs services/ml/* itself)
# Variables:
#   ML_INTERNAL_TOKEN=<same value as the web service>
# Railway assigns $PORT automatically; the Dockerfile's CMD already binds to it.
# No public networking needed — web reaches it over the private
# `<service-name>.railway.internal` hostname on the port Railway assigns.

# ── Deploy the worker as a third Railway service (same repo, optional) ─────
# New service → same GitHub repo → Settings:
#   Builder:         Dockerfile
#   Dockerfile Path: apps/worker/Dockerfile
#   Root Directory:  / (repo root)
# Variables:
#   DATABASE_URL=${{Postgres.DATABASE_URL}}
#   ML_SERVICE_URL=http://ml.railway.internal:8000
#   ML_INTERNAL_TOKEN=<same value as web and ml>
#   RP_USE_QUEUE=1
#   GEMINI_API_KEY* / GROQ_API_KEY* (optional, same as web)
# This service has no HTTP port — leave networking off; it just needs to
# stay running (pg-boss long-polls Postgres for jobs).
