# Railway Deployment Configuration for RevenuePulse.
#
# Stack: Next.js web + pg-boss worker (Node) + FastAPI ML service on top of
# a single managed PostgreSQL instance. Redis is NOT used — the job queue and
# all persistence live in Postgres (pg-boss).
#
# A minimal deploy can run everything inline in the web service
# (RP_USE_QUEUE unset). For scale, deploy the `worker` and `ml` services too
# and set the env vars shown below.

[build]
  # Build the Next.js web app from the repo root (npm workspaces).
  builder = "nixpacks"
  buildCommand = "npm install && cd packages/database && npx prisma generate && cd ../../apps/web && npm run build"

[deploy]
  startCommand = "npx prisma db push && node apps/web/.next/standalone/apps/web/server.js"
  healthcheckPath = "/api/health"
  healthcheckTimeout = 120

# Environment variables (set these in the Railway dashboard as secrets)
#   DATABASE_URL            — Railway-managed PostgreSQL connection string
#   NEXTAUTH_URL            — https://<your-app>.upstash.app or your domain
#   NEXTAUTH_SECRET         — openssl rand -base64 32
#   ML_SERVICE_URL          — URL of the ML service (http://ml:8000 or the
#                             Railway `.railway.internal` hostname)
#   ML_INTERNAL_TOKEN       — shared secret the worker sends to the ML service
#   GEMINI_API_KEY[_2|_3]   — Gemini keys (multi-key failover, optional)
#   GROQ_API_KEY[_2]        — Groq keys (multi-key failover, optional)

# Optional: run the pipeline through the pg-boss worker instead of inline.
#   RP_USE_QUEUE=1

# Deploy the ML service as a separate Railway service (Python):
#   build:   cd services/ml && pip install -r requirements.txt
#   start:   uvicorn src.main:app --host 0.0.0.0 --port $PORT
#   env:     ML_INTERNAL_TOKEN=<same as web/worker>

# Deploy the worker as a separate Railway service (Node):
#   build:   npm install && cd packages/database && npx prisma generate
#   start:   npx tsx apps/worker/index.ts
#   env:     DATABASE_URL, ML_SERVICE_URL, ML_INTERNAL_TOKEN, RP_USE_QUEUE=1,
#            GEMINI_API_KEY*, GROQ_API_KEY*
